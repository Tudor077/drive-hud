name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: write
    env:
      # `secrets` cannot be read from a step-level `if`, so it is surfaced here.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # The android/ directory is generated, not committed: app.json and the
      # config plugins are the single source of truth for the native project.
      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install

      - name: Use the release keystore
        # Falls back to the debug keystore when no secret is configured, which
        # still produces an APK that installs fine by sideloading.
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          node scripts/apply-release-signing.mjs

      - name: Assemble
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/DriveHUD.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DriveHUD-apk
          path: dist/DriveHUD.apk
          if-no-files-found: error

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DriveHUD.apk
